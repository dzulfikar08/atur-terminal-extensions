name: Harness

# Loads built extensions in WebKitGTK, the engine Atur Terminal uses on Linux, behind the
# same `atur-ext://` scheme and a mock host, and uploads screenshots. Used to check that an
# extension runs in the app's webview and to render listing screenshots.
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/harness/**"
      - "extensions/openpencil/**"
      - ".github/workflows/harness.yml"
  workflow_dispatch:
    inputs:
      cases:
        description: "Space-separated case names (tools/harness/cases). Empty = all."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  harness:
    name: WebKitGTK harness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.x"

      - name: Install WebKitGTK and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-gi python3-gi-cairo python3-cairo python3-pil gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libgl1-mesa-dri mesa-utils fonts-noto-core fonts-dejavu-core
          dpkg -l | grep -E "libwebkit2gtk-4.1-0" | awk '{print $2, $3}'

      - run: npm ci

      - name: Build the cases' extensions
        env:
          CASES: ${{ github.event.inputs.cases }}
        run: |
          set -euo pipefail
          cases="$CASES"
          if [ -z "$cases" ]; then cases="$(ls tools/harness/cases | sed 's/\.json$//' | tr '\n' ' ')"; fi
          exts="$(for c in $cases; do node -e 'console.log(require("./tools/harness/cases/"+process.argv[1]+".json").extension)' "$c"; done | sort -u | tr '\n' ' ')"
          echo "building: $exts"
          node scripts/build.mjs $exts
          echo "CASE_LIST=$cases" >> "$GITHUB_ENV"

      - name: Run harness
        run: node tools/harness/run.mjs $CASE_LIST

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness
          path: tools/harness/out/
          if-no-files-found: ignore
