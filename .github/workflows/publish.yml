name: Publish

# On merge to main, every extension whose files changed is built, validated,
# packed, signed with EXTENSIONS_SIGNING_KEY and uploaded to the Atur Terminal
# extensions store (https://extensions.diatur.com). Published versions are
# immutable: a version the store already has is skipped, a lower one is rejected.
#
# Run it by hand (workflow_dispatch) to publish named extensions again or to
# publish the first-party set: pass `first-party` or a space-separated list.

on:
  push:
    branches: [main]
    paths:
      - "extensions/**"
  workflow_dispatch:
    inputs:
      extensions:
        description: "Space-separated extension names to (re)publish, or `first-party`. Empty = none."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Pack, sign, and upload changed extensions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install tooling
        run: npm ci

      - name: Check publishing is configured
        id: configured
        env:
          HAS_SIGNING_KEY: ${{ secrets.EXTENSIONS_SIGNING_KEY != '' }}
          HAS_PUBLISH_TOKEN: ${{ secrets.EXTENSIONS_PUBLISH_TOKEN != '' }}
        run: |
          if [ ! -s signing.pub ]; then
            echo "::error::signing.pub is missing."
            exit 1
          fi
          if [ "$HAS_SIGNING_KEY" != "true" ] || [ "$HAS_PUBLISH_TOKEN" != "true" ]; then
            echo "::notice::EXTENSIONS_SIGNING_KEY / EXTENSIONS_PUBLISH_TOKEN are not set; skipping publish."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine changed extensions
        id: changed
        if: steps.configured.outputs.ready == 'true'
        env:
          DISPATCH_INPUT: ${{ github.event.inputs.extensions }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_INPUT" = "first-party" ]; then
              raw="$(node -e 'console.log(require("./first-party.json").extensions.join(" "))')"
            else
              raw="$DISPATCH_INPUT"
            fi
          else
            before="$BEFORE_SHA"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="HEAD~1"
            fi
            if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              echo "::warning::before ref '$before' is not available; falling back to HEAD~1"
              before="HEAD~1"
            fi
            raw="$(git diff --name-only "$before" "$AFTER_SHA" -- extensions/ \
              | awk -F/ 'NF>1 && $1=="extensions" {print $2}' \
              | sort -u)"
          fi

          names=""
          for name in $raw; do
            if ! printf '%s' "$name" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
              echo "::warning::skipping name with invalid characters: '$name'"
              continue
            fi
            if [ ! -f "extensions/$name/package.json" ]; then
              echo "skip $name (removed)"
              continue
            fi
            names="$names $name"
          done
          names="$(printf '%s' "$names" | sed 's/^ *//')"
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${names:-<none>}"

      - name: Test tooling
        if: steps.changed.outputs.names != ''
        run: npm test

      - name: Build changed extensions
        if: steps.changed.outputs.names != ''
        env:
          NAMES: ${{ steps.changed.outputs.names }}
        run: node scripts/build.mjs $NAMES

      - name: Validate changed extensions
        if: steps.changed.outputs.names != ''
        env:
          NAMES: ${{ steps.changed.outputs.names }}
        run: node scripts/validate.mjs $NAMES

      - name: Pack, sign, and upload
        if: steps.changed.outputs.names != ''
        env:
          NAMES: ${{ steps.changed.outputs.names }}
          EXTENSIONS_PUBLISH_URL: https://extensions.diatur.com/api/publish
          EXTENSIONS_PUBLISH_TOKEN: ${{ secrets.EXTENSIONS_PUBLISH_TOKEN }}
          EXTENSIONS_SIGNING_KEY: ${{ secrets.EXTENSIONS_SIGNING_KEY }}
        run: node scripts/publish.mjs $NAMES
